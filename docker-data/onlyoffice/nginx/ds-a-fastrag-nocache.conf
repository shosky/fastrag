# FastRAG 定制：禁用插件资源的一年期强缓存。
# 文件名以 ds-a- 开头是为了让 include 通配(ds-*.conf)在 ds-docservice.conf 之前
# 匹配本 location（nginx 正式 location 按出现顺序取第一个命中）。
# 否则 expires 365d 会把插件清单/脚本钉死在浏览器磁盘缓存里，
# 导致「改了配置却永远读到旧文件」（本次排障实测根因之一）。
location ~ ^(\/[\d]+\.[\d]+\.[\d]+[\.|-][\d]+)?\/(sdkjs-plugins)(\/.*)$ {
    alias /var/www/onlyoffice/documentserver/$2$3;
    add_header Cache-Control "no-cache, must-revalidate";
    add_header Access-Control-Allow-Origin *;
}
