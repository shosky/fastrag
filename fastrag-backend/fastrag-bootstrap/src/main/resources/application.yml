server:
  port: 8081
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: fastrag-backend
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:3306/fastrag?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&connectionCollation=utf8mb4_unicode_ci&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:
      database: 0
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:fastrag}
    password: ${RABBITMQ_PASS:fastrag123}
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 2
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          socket-factory:
            class: javax.net.ssl.SSLSocketFactory
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id

jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000

ai:
  gateway:
    url: http://127.0.0.1:11434
  asr:
    url: https://api.siliconflow.cn
    key: ${ASR_API_KEY:}
    model: FunAudioLLM/SenseVoiceSmall
  ocr:
    url: https://api.siliconflow.cn
    key: ${ASR_API_KEY:}
    model: deepseek-ai/DeepSeek-OCR
  ffmpeg:
    path: D:\Servers\ffmpeg-master-latest-win64-gpl\bin\ffmpeg.exe

# Milvus 向量数据库
milvus:
  host: 39.97.60.18
  port: 19530

# 本地文件存储路径
storage:
  local:
    path: ./uploads

# Neo4j 图数据库（默认禁用，通过环境变量启用）
# 本地开发需设置 NEO4J_ENABLED=true + NEO4J_URI
neo4j:
  enabled: ${NEO4J_ENABLED:false}
  uri: ${NEO4J_URI:bolt://localhost:7687}
  user: ${NEO4J_USER:neo4j}
  password: ${NEO4J_PASSWORD:}

# Actuator 配置
management:
  health:
    neo4j:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.fastrag: INFO
    com.fastrag.ai.llm.LlmService: DEBUG
    com.fastrag.module.agent.executor.AgentEngine: DEBUG
    org.springframework.security: INFO
