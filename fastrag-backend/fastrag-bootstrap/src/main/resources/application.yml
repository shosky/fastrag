server:
  port: 8081
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: fastrag-backend
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:3306/fastrag?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&connectionCollation=utf8mb4_unicode_ci&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  sql:
    init:
      mode: never
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:
      database: 0
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:fastrag}
    password: ${RABBITMQ_PASS:fastrag123}
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 2
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          socket-factory:
            class: javax.net.ssl.SSLSocketFactory
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id

jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000

ai:
  gateway:
    url: http://127.0.0.1:11434
    timeout: 30
    # 单次 LLM 流式调用最大等待时长（秒），长回答/推理模型建议 >= 240
    stream-timeout: 240
  # 外部 API 代理配置（访问 OpenAI 等被墙服务时需要）
  proxy:
    enabled: true
    host: 127.0.0.1
    port: 10808
    # 不走代理的域名（正则表达式，逗号分隔不行、用 | 分隔多个）。
    # reactor-netty 的 nonProxyHosts 参数是正则而非 *.host 通配；
    # 实测本地 xray 代理对 api.siliconflow.cn 不通（请求挂起），必须直连；
    # 本地地址（localhost/127.0.0.1，如 Ollama 网关 11434）也必须直连，
    # 否则本地请求会经代理转发并触发 PrematureCloseException（语义切片 embedding 报错即此因）；
    # 其他需要代理才能访问的服务（OpenAI 等）不受影响。
    non-proxy-hosts: 'localhost|127\.0\.0\.1|.*\.siliconflow\.cn'
  asr:
    url: https://api.siliconflow.cn
    key: ${ASR_API_KEY:}
    model: FunAudioLLM/SenseVoiceSmall
    # 可选多引擎（上传向导可选择，需自行部署/配置对应服务，未配置时回退上方默认引擎）
    engines:
      whisper:
        url: https://api.openai.com
        key: ${WHISPER_API_KEY:}
        model: whisper-1
  ocr:
    url: https://api.siliconflow.cn
    key: ${ASR_API_KEY:}
    model: deepseek-ai/DeepSeek-OCR
    # 可选多引擎（PaddleOCR 需部署为 OpenAI 兼容接口，未配置时回退上方默认引擎）
    engines:
      paddle:
        url: http://localhost:8866
        key: ${PADDLE_OCR_KEY:}
        model: PaddleOCR
  ffmpeg:
    path: D:\Servers\ffmpeg-master-latest-win64-gpl\bin\ffmpeg.exe

# Milvus 向量数据库
milvus:
  host: 39.97.60.18
  port: 19530

# 本地文件存储路径
storage:
  local:
    path: ./uploads

# Neo4j 图数据库（默认禁用，通过环境变量启用）
# 本地开发需设置 NEO4J_ENABLED=true + NEO4J_URI
neo4j:
  enabled: ${NEO4J_ENABLED:false}
  uri: ${NEO4J_URI:bolt://localhost:7687}
  user: ${NEO4J_USER:neo4j}
  password: ${NEO4J_PASSWORD:}

# 图谱构建配置
graph:
  build:
    # 每个文件内部 chunk 处理的线程池大小
    concurrency: 15
    # LLM 抽取超时（秒），Qwen3 等模型 thinking 关闭后通常 30-60s 内完成
    # 若仍频繁超时可适当调大（如 300），但会增加单文件处理时间
    llm-timeout: 180
  # 实体 embedding 维度（须与 KB 使用的 embedding 模型维度一致，bge-m3/text-embedding-v4 均为 1024）
  entity-embedding-dimension: 1024

# 微信小程序
wechat:
  miniapp:
    app-id: ${WECHAT_APP_ID:}
    app-secret: ${WECHAT_APP_SECRET:}

# OnlyOffice Document Server（在线渲染 / 编辑 Office 文档）
# 关闭时回退到前端 mammoth / xlsx / pptx-preview 渲染（FilePreviewDialog 内置兼容）
# 本地默认开启，prod 部署通过环境变量 ONLYOFFICE_ENABLED=false 关闭
onlyoffice:
  enabled: ${ONLYOFFICE_ENABLED:true}
  # 浏览器 / FastRAG 服务端 → OO 的 URL（OO 容器映射到宿主 8082）
  url: ${ONLYOFFICE_URL:http://localhost:8082}
  # FastRAG → OO 拉取保存后文件时的 base URL；与 url 同源即可
  internal-url: ${ONLYOFFICE_INTERNAL_URL:http://localhost:8082}
  # 与 OnlyOffice Document Server JWT_SECRET 同步；服务端签名 + 验签共用
  jwt-secret: ${ONLYOFFICE_JWT_SECRET:fastrag-onlyoffice-dev-secret-change-me}
  # 与 OO 容器 token.enable 保持同步：false 时 config 不签名 / callback 跳过 token 校验
  # （OO 禁用 JWT 后回调 body 不再携带 token 字段；document.key 校验仍保留）
  # 本地开发默认关闭（OO 容器 local.json 已设 token.enable.*=false）；生产环境设 true
  jwt-enabled: ${ONLYOFFICE_JWT_ENABLED:false}
  # OO 容器 → FastRAG 原始文件 / 回调写入 时的 base URL
  # 容器视角：宿主服务用 host.docker.internal（同机 FastRAG）；若 FastRAG 也在容器内则改成 http://fastrag-app:8081
  callback-base-url: ${ONLYOFFICE_CALLBACK_BASE_URL:http://host.docker.internal:8081}
  storage-base-url: ${ONLYOFFICE_STORAGE_BASE_URL:http://host.docker.internal:8081}

# Actuator 配置
management:
  health:
    neo4j:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.fastrag: INFO
    com.fastrag.ai.llm.LlmService: DEBUG
    com.fastrag.module.agent.executor.AgentEngine: DEBUG
    org.springframework.security: INFO
